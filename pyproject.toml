[project]
name = "atlanta-regional-applications"
version = "1.0.0"
description = "Regional data explorer, housing and economic mobility applications"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Authlib==1.9.5",
  "geopandas==1.2.0",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "openpyxl==3.1.5",
  "pandas==3.1.1",
  "pillow==13.0.0",
  "pyarrow==26.0.1",
  "pyogrio==0.13.0",
  "python-multipart==0.0.33",
  "reportlab==5.1.0",
  "shapely==2.2.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["uv==0.13.7", "ruff==0.17.4", "ty==0.0.98"]

[tool.uv]
package = false
required-version = ">=0.13.7"

[tool.ruff]
target-version = "py312"
line-length = 88
include = ["site/*.py", "deploy/database.py", "deploy/warm_cache.py", "deploy/package.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["site"]

[tool.ty.src]
include = ["site", "deploy/database.py", "deploy/warm_cache.py", "deploy/package.py"]
exclude = ["site/.venv", "site/state"]

[tool.ruff.lint.per-file-ignores]
# These entry points establish isolated state and source paths before importing the app.
"tests/test_application.py" = ["E402"]
"deploy/warm_cache.py" = ["E402"]
